---
layout: default_style
permalink: /contact
published: true
---

<div class="container-fluid-kamn">
  <div class="row">
    <div>
      <iframe width="100%" height="450px" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="{{ site.google_map }}"></iframe>
      <br />
    </div>

    <div class="container">
      <div class="col-lg-4">
        <h4>Find us at:</h4>

        <p class="block-author">{{ site.company_name }}</p>
        <p>{{ site.address_line }}</p>
        <p>Phone: {{ site.telephone_number }}</p>
        <!-- <p>Fax: {{ site.fax_number }}</p> -->
        <em class="block-author">Email: {{ site.company_email }}</em>
        <br><br>
      </div>

      <div class="col-lg-8">
        <div class="feedback-form">
          <div id="contact-response"></div>

          <!-- Sends to your Google Apps Script web app -->
          <form action="https://script.google.com/macros/s/AKfycbwV9_R46P4PFm2O-bRQwYOmZNGthu-CZaHDUb1wPFZWQ1633_gI5PG1GQsY7J9LZ7nYcg/exec"
                method="post" id="contact-form" accept-charset="UTF-8" autocomplete="off">

            <!-- Honeypot (spam trap). Humans won't see/fill this. -->
            <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">

            <fieldset>
              <div class="form-group form-group-fullname">
                <label class="control-label" for="fullname">NAME *</label>
                <input type="text"
                       class="form-control"
                       name="fullname"
                       id="fullname"
                       placeholder="Enter Your Name"
                       required>
              </div>

              <div class="form-group form-group-email">
                <label class="control-label" for="email">E-MAIL *</label>
                <input type="email"
                       class="form-control"
                       name="email"
                       id="email"
                       placeholder="Enter Your E-Mail"
                       required>
              </div>

              <div class="form-group form-group-message">
                <label class="control-label" for="message">MESSAGE *</label>
                <textarea class="form-control"
                          name="message"
                          id="message"
                          rows="3"
                          placeholder="How can we help?"
                          required></textarea>
              </div>

              <button type="submit" class="btn btn-primary">Submit</button>
            </fieldset>
          </form>

          <noscript>
            <p class="text-danger" style="margin-top:10px;">
              JavaScript is disabled. If the form does not submit, please email us at
              <a href="mailto:store@piercespawparadise.com">store@piercespawparadise.com</a>.
            </p>
          </noscript>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('contact-form');
  if (!form) return;

  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbw0Fj7y9lbEZVMSJTPsyBVo_Si4VzbYPyCB1rRgCMk9JUJb7b8xj3Z2Skfezp7zKaSDCA/exec';
  var THANKYOU = '{{ site.baseurl }}/thank-you.html';

  form.addEventListener('submit', function (e) {
    e.preventDefault();                 // stop browser navigating to script.google.com
    var data = new FormData(form);

    // fire-and-forget post; we don’t need to read the response
    fetch(ENDPOINT, { method: 'POST', body: data, mode: 'no-cors' })
      .then(function () { window.location.href = THANKYOU; })
      .catch(function () { window.location.href = THANKYOU; }); // still send user to thank-you
  });
})();
</script>
<!-- End Contact Form -->
