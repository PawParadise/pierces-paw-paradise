layout: default_style
permalink: /thank-you.html
published: true
title: Thank you
robots: noindex
---

<div class="container-fluid-kamn">
  <div class="row">
    <div>
      <iframe width="100%" height="450px" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="{{ site.google_map }}"></iframe>
      <br />
    </div>

    <div class="container">
      <!-- Left column: same contact info as Contact page -->
      <div class="col-lg-4">
        <h4>Find us at:</h4>

        <p class="block-author">{{ site.company_name }}</p>
        <p>{{ site.address_line }}</p>
        <p>Phone: {{ site.telephone_number }}</p>
        <!-- <p>Fax: {{ site.fax_number }}</p> -->

        <em class="block-author">Email: {{ site.company_email }}</em>
        <br><br>
      </div>

      <!-- Right column: success message in place of the form -->
      <div class="col-lg-8">
        <div class="feedback-form">
          <div class="alert alert-success" role="alert" style="margin-top:10px;">
            <h3 style="margin-top:0;">Thanks — your message was sent.</h3>
            <p>We'll get back to you soon!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
